services:
  postgres:
    image: postgres:18
    container_name: hermes-postgres
    environment:
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hermes_postgres_data:/var/lib/postgresql

volumes:
  hermes_postgres_data:
