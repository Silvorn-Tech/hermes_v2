[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-v2"
version = "0.1.0"
description = "Infrastructure foundation for an adaptive quantitative trading system."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Hermes v2 Contributors" }]
dependencies = [
    "psycopg[binary]>=3.2",
    "SQLAlchemy>=2.0",
    "fastapi>=0.115",
    "alembic>=1.13",
    "uvicorn[standard]>=0.30",
    "google-auth>=2.56,<3",
    "requests>=2.32",
]

[project.scripts]
hermes = "hermes_v2.cli:main"

[project.optional-dependencies]
dev = [
    "bandit>=1.9",
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx2>=0.28.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["database: requires a PostgreSQL database configured through DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
